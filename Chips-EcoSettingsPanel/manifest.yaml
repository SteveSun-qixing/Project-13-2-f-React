id: com.chips.eco-settings-panel
name: 生态设置面板
version: 0.1.0
type: app
entry: dist/index.html

description: 薯片生态与 Host 的统一运行时设置面板，负责应用插件与运行时插件治理，并提供开发者工具链入口。

author:
  name: sevenstars
  email: eco-settings-panel@chips.local

keywords:
  - chips
  - settings
  - plugin
  - runtime

permissions:
  - theme.write
  - i18n.write
  - plugin.read
  - config.read
  - config.write
  - plugin.manage
  - platform.read
  - platform.external
  - command.read
  - command.write
  - command.invoke

runtime:
  targets:
    desktop:
      supported: true
    web:
      supported: false
    mobile:
      supported: false
    headless:
      supported: false

capabilityFallbacks:
  open-file:
    whenUnsupported: reject
  save-file:
    whenUnsupported: reject

engines:
  chips: "^1.0.0"

os:
  - darwin
  - win32
  - linux

ui:
  layout:
    owner: page
    unit: cpx
    baseWidth: 1280
  launcher:
    displayName: 生态设置面板
    icon: assets/icons/app-icon.ico
  surface:
    defaultKind: window
    preferredKinds:
      desktop: window
      web: route
      mobile: fullscreen
      headless: window
  window:
    chrome:
      frame: true
      titleBarStyle: default
