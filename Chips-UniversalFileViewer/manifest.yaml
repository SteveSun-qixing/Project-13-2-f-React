capabilityFallbacks:
  open-file:
    whenUnsupported: reject
  save-file:
    whenUnsupported: download

cli:
  commands:
    - commandPath: universal-file-viewer open
      target:
        type: app
        pluginId: com.chips.universal-file-viewer
        surface:
          open: true
          focus: true
          reuse: preferred
      titleKey: universal-viewer.cli.open.title
      descriptionKey: universal-viewer.cli.open.description
      arguments:
        - name: path
          position: 0
          type: path
          required: true
          mapsTo: targetPath
      output:
        mode: json

engines:
  chips: "^1.0.0"

os:
  - darwin
  - win32
  - linux

ui:
  layout:
    owner: page
    unit: cpx
    baseWidth: 1024
  launcher:
    displayName: 万能文件查看器
    icon: assets/icons/app-icon.ico
  surface:
    defaultKind: window
    preferredKinds:
      desktop: window
      web: route
      mobile: fullscreen
      headless: window
  window:
    chrome:
      frame: true
      titleBarStyle: default
