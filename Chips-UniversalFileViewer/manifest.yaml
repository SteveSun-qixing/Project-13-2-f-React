id: com.chips.universal-file-viewer
name: 万能文件查看器
version: 0.1.0
type: app
entry: dist/index.html

description: 万能文件查看器是薯片生态的通用文件预览应用插件，作为专用查看器之外的兜底查看入口，覆盖图片、音视频、文本代码、PDF、Office、电子书、压缩包、邮件、CAD、3D 模型、GIS、设计资产等常见格式。

author:
  name: sevenstars
  email: universal-file-viewer@chips.local

keywords:
  - chips
  - app
  - viewer
  - file-preview

permissions:
  - resource.read
  - file.read
  - file.write
  - platform.read
  - command.read
  - command.write
  - command.invoke

runtime:
  targets:
    desktop:
      supported: true
    web:
      supported: false
    mobile:
      supported: false
    headless:
      supported: false

capabilities:
  # —— 兜底层级（@fallback）：专用查看器优先，未安装对应专用查看器时由本插件接管 ——
  # 图片
  - resource-handler:view:image/*@fallback
  # 视频 / 音频
  - resource-handler:view:video/*@fallback
  - resource-handler:view:audio/*@fallback
  # 文本 / 代码 / 数据
  - resource-handler:view:text/*@fallback
  - resource-handler:view:application/json@fallback
  - resource-handler:view:application/xml@fallback
  - resource-handler:view:application/yaml@fallback
  - resource-handler:view:text/yaml@fallback
  - resource-handler:view:text/csv@fallback
  - resource-handler:view:text/markdown@fallback
  - resource-handler:view:text/html@fallback
  # PDF / 电子书 / 版式文档
  - resource-handler:view:application/pdf@fallback
  - resource-handler:view:application/epub+zip@fallback
  - resource-handler:view:application/vnd.ms-xpsdocument@fallback
  - resource-handler:view:application/oxps@fallback
  - resource-handler:view:application/ofd@fallback
  # Office 文档
  - resource-handler:view:application/rtf@fallback
  - resource-handler:view:application/msword@fallback
  - resource-handler:view:application/vnd.openxmlformats-officedocument.wordprocessingml.document@fallback
  - resource-handler:view:application/vnd.ms-excel@fallback
  - resource-handler:view:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet@fallback
  - resource-handler:view:application/vnd.ms-powerpoint@fallback
  - resource-handler:view:application/vnd.openxmlformats-officedocument.presentationml.presentation@fallback
  - resource-handler:view:application/vnd.oasis.opendocument.text@fallback
  - resource-handler:view:application/vnd.oasis.opendocument.spreadsheet@fallback
  - resource-handler:view:application/vnd.oasis.opendocument.presentation@fallback
  # 压缩包
  - resource-handler:view:application/zip@fallback
  - resource-handler:view:application/vnd.rar@fallback
  - resource-handler:view:application/x-7z-compressed@fallback
  - resource-handler:view:application/x-tar@fallback
  - resource-handler:view:application/gzip@fallback
  - resource-handler:view:application/x-bzip2@fallback
  - resource-handler:view:application/x-xz@fallback
  # 邮件
  - resource-handler:view:message/rfc822@fallback
  - resource-handler:view:application/vnd.ms-outlook@fallback
  - resource-handler:view:application/mbox@fallback
  # 绘图 / 思维导图
  - resource-handler:view:application/vnd.jgraph.mxfile@fallback
  - resource-handler:view:application/vnd.excalidraw+json@fallback
  - resource-handler:view:application/vnd.xmind.workbook@fallback
  # CAD（DXF 文本格式；DWG 二进制格式不声明，回退系统处理）
  - resource-handler:view:image/vnd.dxf@fallback
  # 3D 模型
  - resource-handler:view:model/gltf+json@fallback
  - resource-handler:view:model/gltf-binary@fallback
  - resource-handler:view:model/stl@fallback
  - resource-handler:view:model/obj@fallback
  # GIS
  - resource-handler:view:application/geo+json@fallback
  - resource-handler:view:application/topo+json@fallback
  - resource-handler:view:application/vnd.google-earth.kml+xml@fallback
  - resource-handler:view:application/gpx+xml@fallback
  # 设计资产 / 数据 / 字体
  - resource-handler:view:image/vnd.adobe.photoshop@fallback
  - resource-handler:view:application/vnd.sqlite3@fallback
  - resource-handler:view:application/vnd.apache.parquet@fallback
  - resource-handler:view:font/ttf@fallback
  - resource-handler:view:font/otf@fallback
  - resource-handler:view:font/woff@fallback
  - resource-handler:view:font/woff2@fallback
  # —— 扩展名兜底声明（file-handler）——
  # 图片
  - file-handler:.png@fallback
  - file-handler:.jpg@fallback
  - file-handler:.jpeg@fallback
  - file-handler:.jfif@fallback
  - file-handler:.gif@fallback
  - file-handler:.webp@fallback
