worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # ─── 上游服务 ──────────────────────────────────────────────────
    upstream ccps_server {
        server server:3000;
        keepalive 32;
    }

    upstream ccps_web {
        server web:80;
        keepalive 32;
    }

    upstream ccps_admin {
        server admin:80;
        keepalive 32;
    }

    server {
        listen 80;
        server_name chipscard.space www.chipscard.space;

        return 301 https://www.chipscard.space$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name chipscard.space;

        ssl_certificate /etc/nginx/certs/chipscard.space_ca.crt;
        ssl_certificate_key /etc/nginx/certs/chipscard.space.key;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        return 301 https://www.chipscard.space$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name www.chipscard.space;

        ssl_certificate /etc/nginx/certs/chipscard.space_ca.crt;
        ssl_certificate_key /etc/nginx/certs/chipscard.space.key;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # 安全响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 客户端上传大小限制（略大于卡片最大值 500MB）
        client_max_body_size 520M;

        # ─── API ───────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://ccps_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        # ─── 旧 CDN 入口（统一跳转到对象存储自定义 HTTPS 域名） ─────
        location /cdn/ {
            rewrite ^/cdn/(.*)$ https://file.chipscard.space/$1 permanent;
        }

        # ─── 管理后台 ──────────────────────────────────────────────
        location /admin/api/ {
            proxy_pass http://ccps_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        location /admin/ {
            proxy_pass http://ccps_admin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /admin/assets/ {
            proxy_pass http://ccps_admin/assets/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # ─── 前台静态 hash 资源 ────────────────────────────────────
        location /assets/ {
            proxy_pass http://ccps_web/assets/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # ─── 前端 SPA（所有其他路由） ─────────────────────────────
        location / {
            proxy_pass http://ccps_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # HTML 不缓存（SPA 路由需要动态）
            add_header Cache-Control "no-cache" always;
        }
    }
}
