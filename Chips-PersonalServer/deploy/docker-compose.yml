# 固定项目名，避免与社区服务器（同样位于 deploy/ 目录）的 compose 项目冲突
name: cps

services:
  # ─── PostgreSQL（1 核 1G 小内存调优） ──────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cps_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cps_db
      POSTGRES_USER: cps_user
      POSTGRES_PASSWORD: cps_password
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=384MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cps_user -d cps_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cps_net

  # ─── MinIO ─────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: cps_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - cps_net

  # ─── API 服务器 ────────────────────────────────────────────────
  server:
    build:
      context: ../..
      dockerfile: Chips-PersonalServer/deploy/Dockerfile.server
    container_name: cps_server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cps_user:cps_password@postgres:5432/cps_db
      S3_ENDPOINT: ${S3_RUNTIME_ENDPOINT:-http://minio:9000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cps_net

  # ─── Web 前端（生产构建）──────────────────────────────────────
  web:
    build:
      context: ../..
      dockerfile: Chips-PersonalServer/deploy/Dockerfile.web
    container_name: cps_web
    restart: unless-stopped
    networks:
      - cps_net

  # ─── Nginx（反向代理） ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cps_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/chipscard.space_ca.crt:/etc/nginx/certs/chipscard.space_ca.crt:ro
      - ./certs/chipscard.space.key:/etc/nginx/certs/chipscard.space.key:ro
    depends_on:
      - server
      - web
    networks:
      - cps_net

volumes:
  postgres_data:
  minio_data:

networks:
  cps_net:
    driver: bridge
