id: com.chips.book-reader
name: 书籍阅读器
version: 0.1.0
type: app
entry: dist/index.html

description: 薯片生态电子书阅读器应用插件，用于打开本地电子书或由 Host 资源路由唤起的电子书资源。

author:
  name: BookReader
  email: dev@chips.local

keywords:
  - chips
  - book
  - epub
  - reader

capabilities:
  - resource-handler:view:application/epub+zip
  - resource-handler:view:application/pdf
  - resource-handler:view:text/plain
  - resource-handler:view:text/markdown
  - resource-handler:view:text/x-markdown
  - resource-handler:view:application/markdown
  - resource-handler:view:application/x-fictionbook+xml
  - resource-handler:view:application/rtf
  - resource-handler:view:text/rtf
  - resource-handler:view:application/x-mobipocket-ebook
  - resource-handler:view:application/vnd.amazon.ebook
  - resource-handler:view:image/vnd.djvu
  - resource-handler:view:application/msword
  - resource-handler:view:application/vnd.openxmlformats-officedocument.wordprocessingml.document
  - file-handler:.epub
  - file-handler:.epub3
  - file-handler:.pdf
  - file-handler:.txt
  - file-handler:.md
  - file-handler:.markdown
  - file-handler:.fb2
  - file-handler:.rtf
  - file-handler:.mobi
  - file-handler:.azw
  - file-handler:.azw3
  - file-handler:.djvu
  - file-handler:.djv
  - file-handler:.doc
  - file-handler:.docx

permissions:
  - command.read
  - command.write
  - command.invoke
  - resource.read
  - file.read
  - platform.read
  - platform.external
  - config.read
  - config.write
  - network.request

runtime:
  targets:
    desktop:
      supported: true
    web:
      supported: true
    mobile:
      supported: false
    headless:
      supported: false

capabilityFallbacks:
  open-file:
    whenUnsupported: reject

engines:
  chips: "^1.0.0"

os:
  - darwin
  - win32
  - linux

ui:
  layout:
    owner: page
    unit: cpx
    baseWidth: 1280
  launcher:
    displayName: 书籍阅读器
    icon: assets/icons/app-icon.ico
  surface:
    defaultKind: window
    preferredKinds:
      desktop: window
      web: route
      mobile: fullscreen
      headless: window
  window:
    chrome:
      titleBarStyle: default
