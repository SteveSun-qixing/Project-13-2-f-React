# 隔离验证工作区：仅挂载 Rust 核心（chips-core / chips-cordis / chips-bridge）。
#
# 根工作区 `chips-ecosystem/Cargo.toml` 的 members 含 `packages/native`（Neon 绑定，
# 已落地）。本清单提供与根工作区完全一致的工具链与依赖解析入口，供内核侧在不构建
# Neon 绑定的情况下独立完成 `fmt / clippy / test / tarpaulin` 门禁验证；
# `crates/*` 通配自动纳入新增核心 crate（chips-bridge 经工单005 落地入库）。
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
criterion = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
