id: chips.official.iconmaker
version: 0.1.0
type: app
name: 图标工坊
description: 由图片或图标字体生成 PNG、ICO、ICNS 图标资源包
license: MIT
runtime:
  targets:
    - host
  background: false
permissions:
  - command:write
  - command:execute
  - filesystem:read:${userHome}
  - filesystem:write:${userHome}
ui:
  surface: window
  launcher:
    icon: assets/icons/app-icon.svg
    name: 图标工坊
cli:
  commands:
    - commandPath:
        - iconmaker
        - generate
      commandId: iconmaker:generate
      title: 生成图标
      description: 从输入图片生成 PNG、ICO 与 ICNS 图标包
      examples:
        - chips iconmaker generate ~/图片/示例.png
      target:
        type: app
        pluginId: chips.official.iconmaker
        surface:
          open: true
          focus: true
          reuse: preferred
      arguments:
        - name: source
          position: 0
          type: path
          required: true
          mapsTo: source
          path:
            kind: file
            role: input
            exists: true
      output:
        mode: json
        json: supported
