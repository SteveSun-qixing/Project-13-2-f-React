id: chips.official.iconmaker
version: 0.1.0
type: app
name: 图标工坊
description: 由图片或图标字体生成 PNG、ICO、ICNS 图标资源包
license: MIT
runtime:
  targets:
    - host
  background: false
permissions:
  - command:write
  - command:execute
ui:
  surface: window
  launcher:
    icon: assets/icons/app.svg
    name: 图标工坊
cli:
  commands:
    - commandPath:
        - iconmaker
        - open-card
      commandId: iconmaker:open-card
      title: 打开卡片
      description: 通过「图标工坊」打开指定卡片文件
      examples:
        - chips iconmaker open-card ~/文档/示例.cpk
      target:
        type: app
        pluginId: chips.official.iconmaker
        surface:
          open: true
          focus: true
          reuse: preferred
      arguments:
        - name: path
          position: 0
          type: path
          required: true
          mapsTo: path
          path:
            kind: file
            role: input
            exists: true
    - commandPath:
        - iconmaker
        - refresh-view
      commandId: iconmaker:refresh-view
      title: 刷新当前视图
      description: 请求「图标工坊」重新拉取当前展示数据
      target:
        type: app
        pluginId: chips.official.iconmaker
      output:
        mode: json
        json: supported
