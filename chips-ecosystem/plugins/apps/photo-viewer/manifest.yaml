id: chips.official.photo-viewer
version: 0.1.0
type: app
name: 图片查看器
license: MIT
runtime:
  targets:
    - host
  background: false
permissions:
  - resources:read
  - command:write
  - command:execute
ui:
  surface: window
  launcher:
    icon: assets/icons/app.svg
    name: 图片查看器
fileAssociations:
  - extensions: [.png, .jpg, .jpeg, .webp, .gif, .bmp, .svg, .avif]
    mimeTypes: [image/png, image/jpeg, image/webp, image/gif, image/bmp, image/svg+xml, image/avif]
    action: open
cli:
  commands:
    - commandPath:
        - photo-viewer
        - open-card
      commandId: photo-viewer:open-card
      title: 打开卡片
      description: 通过「图片查看器」打开指定卡片文件
      examples:
        - chips photo-viewer open-card ~/文档/示例.cpk
      target:
        type: app
        pluginId: chips.official.photo-viewer
        surface:
          open: true
          focus: true
          reuse: preferred
      arguments:
        - name: path
          position: 0
          type: path
          required: true
          mapsTo: path
          path:
            kind: file
            role: input
            exists: true
    - commandPath:
        - photo-viewer
        - refresh-view
      commandId: photo-viewer:refresh-view
      title: 刷新当前视图
      description: 请求「图片查看器」重新拉取当前展示数据
      target:
        type: app
        pluginId: chips.official.photo-viewer
      output:
        mode: json
        json: supported
