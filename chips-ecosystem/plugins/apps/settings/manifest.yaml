id: chips.official.settings
version: 0.1.0
type: app
name: 生态设置面板
description: 平台设置、插件治理、权限审查、快捷键、文件打开方式、存储、更新与首启引导；随平台内置分发
license: MIT
runtime:
  targets:
    - host
  background: false
permissions:
  - resources:read
  - command:write
  - command:execute
ui:
  surface: window
  launcher:
    icon: assets/icons/app.svg
    name: 生态设置面板
cli:
  commands:
    - commandPath:
        - settings
        - open-card
      commandId: settings:open-card
      title: 打开卡片
      description: 通过「生态设置面板」打开指定卡片文件
      examples:
        - chips settings open-card ~/文档/示例.cpk
      target:
        type: app
        pluginId: chips.official.settings
        surface:
          open: true
          focus: true
          reuse: preferred
      arguments:
        - name: path
          position: 0
          type: path
          required: true
          mapsTo: path
          path:
            kind: file
            role: input
            exists: true
    - commandPath:
        - settings
        - refresh-view
      commandId: settings:refresh-view
      title: 刷新当前视图
      description: 请求「生态设置面板」重新拉取当前展示数据
      target:
        type: app
        pluginId: chips.official.settings
      output:
        mode: json
        json: supported
