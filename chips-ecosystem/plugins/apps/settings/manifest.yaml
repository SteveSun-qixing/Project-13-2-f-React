id: chips.official.settings
version: 0.1.0
type: app
name: 生态设置面板
description: 平台设置、插件治理、权限审查、快捷键、文件打开方式、存储、更新与首启引导；随平台内置分发
license: MIT
runtime:
  targets:
    - host
  background: false
permissions:
  - command:write
  - command:execute
  - config:read:platform
  - config:write:platform
ui:
  surface: window
  launcher:
    icon: assets/icons/app.svg
    name: 生态设置面板
cli:
  commands:
    - commandPath:
        - settings
        - open
      commandId: settings:open
      title: 打开设置面板
      description: 打开或聚焦「生态设置面板」主窗口
      examples:
        - chips settings open
      target:
        type: app
        pluginId: chips.official.settings
        surface:
          open: true
          focus: true
          reuse: preferred
    - commandPath:
        - settings
        - refresh-view
      commandId: settings:refresh-view
      title: 刷新当前视图
      description: 重新读取偏好快照并刷新设置面板展示
      target:
        type: app
        pluginId: chips.official.settings
      output:
        mode: json
        json: supported
