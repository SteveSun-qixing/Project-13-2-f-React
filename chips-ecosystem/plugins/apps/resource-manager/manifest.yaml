id: chips.official.resource-manager
version: 0.1.0
type: app
name: 资源管理器
description: 工作区浏览、查找与批量组织：重命名、移动、复制、删除、新建目录、批量标签、收藏与最近；不创建卡片、不编辑内容、不解析文档
license: MIT
runtime:
  targets:
    - host
  background: false
permissions:
  - resources:read
  - command:write
  - command:execute
ui:
  surface: window
  launcher:
    icon: assets/icons/app.svg
    name: 资源管理器
cli:
  commands:
    - commandPath:
        - resource-manager
        - open-card
      commandId: resource-manager:open-card
      title: 打开文档浏览
      description: 按来源引用打开指定卡片或箱子并进入只读浏览
      examples:
        - chips resource-manager open-card ~/文档/示例.card
      target:
        type: app
        pluginId: chips.official.resource-manager
        surface:
          open: true
          focus: true
          reuse: preferred
      arguments:
        - name: path
          position: 0
          type: path
          required: true
          mapsTo: path
          path:
            kind: file
            role: input
            exists: true
    - commandPath:
        - resource-manager
        - refresh-view
      commandId: resource-manager:refresh-view
      title: 刷新当前视图
      description: 请求「资源管理器」重新拉取当前展示数据
      target:
        type: app
        pluginId: chips.official.resource-manager
      output:
        mode: json
        json: supported
