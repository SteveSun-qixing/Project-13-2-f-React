id: chips.official.book-reader
version: 0.1.0
type: app
name: 书籍阅读器
description: EPUB、PDF、TXT、Markdown 等格式的书籍阅读
license: MIT
runtime:
  targets:
    - host
  background: false
permissions:
  - resources:read
  - command:write
  - command:execute
ui:
  surface: window
  launcher:
    icon: assets/icons/app.svg
    name: 书籍阅读器
fileAssociations:
  - extensions: []
    mimeTypes: [application/pdf]
    action: open
cli:
  commands:
    - commandPath:
        - book-reader
        - open-card
      commandId: book-reader:open-card
      title: 打开卡片
      description: 通过「书籍阅读器」打开指定卡片文件
      examples:
        - chips book-reader open-card ~/文档/示例.cpk
      target:
        type: app
        pluginId: chips.official.book-reader
        surface:
          open: true
          focus: true
          reuse: preferred
      arguments:
        - name: path
          position: 0
          type: path
          required: true
          mapsTo: path
          path:
            kind: file
            role: input
            exists: true
    - commandPath:
        - book-reader
        - refresh-view
      commandId: book-reader:refresh-view
      title: 刷新当前视图
      description: 请求「书籍阅读器」重新拉取当前展示数据
      target:
        type: app
        pluginId: chips.official.book-reader
      output:
        mode: json
        json: supported
