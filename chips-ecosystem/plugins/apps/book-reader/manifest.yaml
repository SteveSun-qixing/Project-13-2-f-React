id: chips.official.book-reader
version: 0.1.0
type: app
name: 书籍阅读器
description: EPUB、PDF、TXT、Markdown 等格式的书籍阅读
license: MIT
runtime:
  targets:
    - host
  background: false
permissions:
  - resources:read
  - command:write
  - command:execute
ui:
  surface: window
  launcher:
    icon: assets/icons/app.svg
    name: 书籍阅读器
fileAssociations:
  - extensions: []
    mimeTypes: [application/pdf]
    action: open
cli:
  commands:
    - commandPath:
        - book-reader
        - open-card
      commandId: book-reader:open-card
      title: 打开卡片
      description: 通过「书籍阅读器」打开指定卡片文件
      examples:
        - chips book-reader open-card ~/文档/示例.cpk
      target:
        type: app
        pluginId: chips.official.book-reader
        surface:
          open: true
          focus: true
          reuse: preferred
      arguments:
        - name: path
          position: 0
          type: path
          required: true
          mapsTo: path
          path:
            kind: file
            role: input
            exists: true
    - commandPath:
        - book-reader
        - refresh-view
      commandId: book-reader:refresh-view
      title: 刷新当前视图
      description: 请求「书籍阅读器」重新拉取当前展示数据
      target:
        type: app
        pluginId: chips.official.book-reader
      output:
        mode: json
        json: supported
    - commandPath:
        - book-reader
        - previous-page
      commandId: book-reader:previous-page
      title: 上一页
      description: 向前翻动一页（滚动模式下向上滚动一屏）
      target:
        type: app
        pluginId: chips.official.book-reader
    - commandPath:
        - book-reader
        - next-page
      commandId: book-reader:next-page
      title: 下一页
      description: 向后翻动一页（滚动模式下向下滚动一屏）
      target:
        type: app
        pluginId: chips.official.book-reader
    - commandPath:
        - book-reader
        - previous-section
      commandId: book-reader:previous-section
      title: 上一章
      description: 跳转到上一个章节
      target:
        type: app
        pluginId: chips.official.book-reader
    - commandPath:
        - book-reader
        - next-section
      commandId: book-reader:next-section
      title: 下一章
      description: 跳转到下一个章节
      target:
        type: app
        pluginId: chips.official.book-reader
    - commandPath:
        - book-reader
        - go-section-start
      commandId: book-reader:go-section-start
      title: 跳到本章开头
      description: 跳转到当前章节起始位置
      target:
        type: app
        pluginId: chips.official.book-reader
    - commandPath:
        - book-reader
        - go-section-end
      commandId: book-reader:go-section-end
      title: 跳到本章末尾
      description: 跳转到当前章节结束位置
      target:
        type: app
        pluginId: chips.official.book-reader
    - commandPath:
        - book-reader
        - toggle-contents
      commandId: book-reader:toggle-contents
      title: 目录
      description: 显示或隐藏章节目录面板
      target:
        type: app
        pluginId: chips.official.book-reader
    - commandPath:
        - book-reader
        - toggle-bookmarks
      commandId: book-reader:toggle-bookmarks
      title: 书签列表
      description: 显示或隐藏书签列表面板
      target:
        type: app
        pluginId: chips.official.book-reader
    - commandPath:
        - book-reader
        - toggle-preferences
      commandId: book-reader:toggle-preferences
      title: 阅读偏好
      description: 显示或隐藏阅读偏好面板（字号、行距、亮度与配色）
      target:
        type: app
        pluginId: chips.official.book-reader
    - commandPath:
        - book-reader
        - toggle-search
      commandId: book-reader:toggle-search
      title: 搜索
      description: 显示或隐藏全书搜索面板
      target:
        type: app
        pluginId: chips.official.book-reader
    - commandPath:
        - book-reader
        - close-panel
      commandId: book-reader:close-panel
      title: 关闭面板
      description: 关闭当前打开的面板
      target:
        type: app
        pluginId: chips.official.book-reader
    - commandPath:
        - book-reader
        - increase-font
      commandId: book-reader:increase-font
      title: 增大字号
      description: 按档位增大正文字号
      target:
        type: app
        pluginId: chips.official.book-reader
    - commandPath:
        - book-reader
        - decrease-font
      commandId: book-reader:decrease-font
      title: 减小字号
      description: 按档位减小正文字号
      target:
        type: app
        pluginId: chips.official.book-reader
    - commandPath:
        - book-reader
        - widen-content
      commandId: book-reader:widen-content
      title: 加宽版心
      description: 加大正文内容区宽度
      target:
        type: app
        pluginId: chips.official.book-reader
    - commandPath:
        - book-reader
        - narrow-content
      commandId: book-reader:narrow-content
      title: 收窄版心
      description: 收窄正文内容区宽度
      target:
        type: app
        pluginId: chips.official.book-reader
    - commandPath:
        - book-reader
        - toggle-bookmark
      commandId: book-reader:toggle-bookmark
      title: 添加或移除书签
      description: 在当前阅读位置添加书签；已存在书签时移除
      target:
        type: app
        pluginId: chips.official.book-reader
