id: chips.official.video-player
version: 0.1.0
type: app
name: 视频播放器
description: 视频播放：控制、倍速、全屏、画中画、字幕与音轨
license: MIT
runtime:
  targets:
    - host
  background: false
permissions:
  - resources:read
  - command:write
  - command:execute
ui:
  surface: window
  launcher:
    icon: assets/icons/app.svg
    name: 视频播放器
fileAssociations:
  - extensions: []
    mimeTypes: [video/*]
    action: open
cli:
  commands:
    - commandPath:
        - video-player
        - open-card
      commandId: video-player:open-card
      title: 打开卡片
      description: 通过「视频播放器」打开指定卡片文件
      examples:
        - chips video-player open-card ~/文档/示例.cpk
      target:
        type: app
        pluginId: chips.official.video-player
        surface:
          open: true
          focus: true
          reuse: preferred
      arguments:
        - name: path
          position: 0
          type: path
          required: true
          mapsTo: path
          path:
            kind: file
            role: input
            exists: true
    - commandPath:
        - video-player
        - refresh-view
      commandId: video-player:refresh-view
      title: 刷新当前视图
      description: 请求「视频播放器」重新拉取当前展示数据
      target:
        type: app
        pluginId: chips.official.video-player
      output:
        mode: json
        json: supported
