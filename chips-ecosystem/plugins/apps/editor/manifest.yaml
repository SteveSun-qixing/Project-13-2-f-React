id: chips.official.editor
version: 0.1.0
type: app
name: 编辑引擎
description: 编辑链路官方消费者与 .card / .box 官方生产工具：工作区场景、卡片与箱子窗口、编辑面板、封面与导出
license: MIT
runtime:
  targets:
    - host
  background: false
permissions:
  - resources:read
  - command:write
  - command:execute
ui:
  surface: window
  launcher:
    icon: assets/icons/app.svg
    name: 编辑引擎
fileAssociations:
  - extensions: [.card, .box]
    action: open
cli:
  commands:
    - commandPath:
        - editor
        - open-card
      commandId: editor:open-card
      title: 打开卡片
      description: 通过「编辑引擎」打开指定卡片文件
      examples:
        - chips editor open-card ~/文档/示例.cpk
      target:
        type: app
        pluginId: chips.official.editor
        surface:
          open: true
          focus: true
          reuse: preferred
      arguments:
        - name: path
          position: 0
          type: path
          required: true
          mapsTo: path
          path:
            kind: file
            role: input
            exists: true
    - commandPath:
        - editor
        - refresh-view
      commandId: editor:refresh-view
      title: 刷新当前视图
      description: 请求「编辑引擎」重新拉取当前展示数据
      target:
        type: app
        pluginId: chips.official.editor
      output:
        mode: json
        json: supported
