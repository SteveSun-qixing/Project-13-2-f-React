id: chips.official.community-client
version: 0.1.0
type: app
name: 薯片社区
description: 社区浏览、认证与会话、卡片上传、完整下载与本地查看
license: MIT
runtime:
  targets:
    - host
  background: false
permissions:
  - command:write
  - command:execute
ui:
  surface: window
  launcher:
    icon: assets/icons/app.svg
    name: 薯片社区
cli:
  commands:
    - commandPath:
        - community-client
        - open-card
      commandId: community-client:open-card
      title: 打开卡片
      description: 通过「薯片社区」打开指定卡片文件
      examples:
        - chips community-client open-card ~/文档/示例.cpk
      target:
        type: app
        pluginId: chips.official.community-client
        surface:
          open: true
          focus: true
          reuse: preferred
      arguments:
        - name: path
          position: 0
          type: path
          required: true
          mapsTo: path
          path:
            kind: file
            role: input
            exists: true
    - commandPath:
        - community-client
        - refresh-view
      commandId: community-client:refresh-view
      title: 刷新当前视图
      description: 请求「薯片社区」重新拉取当前展示数据
      target:
        type: app
        pluginId: chips.official.community-client
      output:
        mode: json
        json: supported
