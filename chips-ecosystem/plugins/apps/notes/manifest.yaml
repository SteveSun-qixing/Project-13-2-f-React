id: chips.official.notes
version: 0.1.0
type: app
name: 笔记
description: 笔记本与笔记工作台：以 .box 为笔记本、.card 为笔记组织与编辑内容
license: MIT
runtime:
  targets:
    - host
  background: false
permissions:
  - resources:read
  - resources:write
  - command:write
  - command:execute
ui:
  surface: window
  launcher:
    icon: assets/icons/app.svg
    name: 笔记
cli:
  commands:
    - commandPath:
        - notes
        - open-card
      commandId: notes:open-card
      title: 打开笔记文档
      description: 按来源引用打开指定卡片或箱子并加入笔记库定位
      examples:
        - chips notes open-card ~/文档/示例.card
      target:
        type: app
        pluginId: chips.official.notes
        surface:
          open: true
          focus: true
          reuse: preferred
      arguments:
        - name: path
          position: 0
          type: path
          required: true
          mapsTo: path
          path:
            kind: file
            role: input
            exists: true
    - commandPath:
        - notes
        - refresh-view
      commandId: notes:refresh-view
      title: 刷新当前视图
      description: 重新读取当前选中文档的元数据与内容
      target:
        type: app
        pluginId: chips.official.notes
      output:
        mode: json
        json: supported
