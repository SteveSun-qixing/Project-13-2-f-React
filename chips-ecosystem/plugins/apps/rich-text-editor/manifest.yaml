id: chips.official.rich-text-editor
version: 0.1.0
type: app
name: 富文本编辑器
description: 单文档 Markdown 所见即所得编辑
license: MIT
runtime:
  targets:
    - host
  background: false
permissions:
  - command:write
  - command:execute
ui:
  surface: window
  launcher:
    icon: assets/icons/app.svg
    name: 富文本编辑器
cli:
  commands:
    - commandPath:
        - rich-text-editor
        - open-card
      commandId: rich-text-editor:open-card
      title: 打开卡片
      description: 通过「富文本编辑器」打开指定卡片文件
      examples:
        - chips rich-text-editor open-card ~/文档/示例.cpk
      target:
        type: app
        pluginId: chips.official.rich-text-editor
        surface:
          open: true
          focus: true
          reuse: preferred
      arguments:
        - name: path
          position: 0
          type: path
          required: true
          mapsTo: path
          path:
            kind: file
            role: input
            exists: true
    - commandPath:
        - rich-text-editor
        - refresh-view
      commandId: rich-text-editor:refresh-view
      title: 刷新当前视图
      description: 请求「富文本编辑器」重新拉取当前展示数据
      target:
        type: app
        pluginId: chips.official.rich-text-editor
      output:
        mode: json
        json: supported
