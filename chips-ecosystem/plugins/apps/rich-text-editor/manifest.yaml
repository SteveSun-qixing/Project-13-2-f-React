id: chips.official.rich-text-editor
version: 0.1.0
type: app
name: 富文本编辑器
description: 单文档 Markdown 所见即所得编辑
license: MIT
runtime:
  targets:
    - host
  background: false
permissions:
  - resources:read
  - resources:write
  - filesystem:write:${userHome}
  - command:write
  - command:execute
ui:
  surface: window
  launcher:
    icon: assets/icons/app.svg
    name: 富文本编辑器
cli:
  commands:
    - commandPath:
        - rich-text-editor
        - open-card
      commandId: rich-text-editor:open-card
      title: 打开卡片
      description: 通过「富文本编辑器」打开指定卡片文件
      examples:
        - chips rich-text-editor open-card ~/文档/示例.cpk
      target:
        type: app
        pluginId: chips.official.rich-text-editor
        surface:
          open: true
          focus: true
          reuse: preferred
      arguments:
        - name: path
          position: 0
          type: path
          required: true
          mapsTo: path
          path:
            kind: file
            role: input
            exists: true
    - commandPath:
        - rich-text-editor
        - save-document
      commandId: rich-text-editor:save-document
      title: 保存当前文档
      description: 完成待提交回流并把当前文档落盘（document:save）
      examples:
        - chips rich-text-editor save-document
      target:
        type: app
        pluginId: chips.official.rich-text-editor
        surface:
          open: true
          focus: true
          reuse: preferred
    - commandPath:
        - rich-text-editor
        - export-document
      commandId: rich-text-editor:export-document
      title: 导出当前文档
      description: 把当前文档导出为归档形态（document:export；宿主实现在途）
      examples:
        - chips rich-text-editor export-document
      target:
        type: app
        pluginId: chips.official.rich-text-editor
        surface:
          open: true
          focus: true
          reuse: preferred
    - commandPath:
        - rich-text-editor
        - new-card
      commandId: rich-text-editor:new-card
      title: 新建富文本卡片
      description: 在指定落点新建富文本卡片（document:create；宿主实现在途）
      examples:
        - chips rich-text-editor new-card --name 未命名卡片 --parent ~/文档
      target:
        type: app
        pluginId: chips.official.rich-text-editor
        surface:
          open: true
          focus: true
          reuse: preferred
      arguments:
        - name: name
          position: 0
          type: string
          mapsTo: name
        - name: parent
          position: 1
          type: path
          mapsTo: parent
          path:
            kind: directory
            role: input
            exists: true
    - commandPath:
        - rich-text-editor
        - refresh-view
      commandId: rich-text-editor:refresh-view
      title: 刷新当前视图
      description: 请求「富文本编辑器」重新拉取当前展示数据
      target:
        type: app
        pluginId: chips.official.rich-text-editor
      output:
        mode: json
        json: supported
