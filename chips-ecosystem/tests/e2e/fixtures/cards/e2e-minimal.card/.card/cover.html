<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Cover</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f5f7fb 0%, #eef3ff 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #111827;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      overflow: hidden;
    }
    .cover-name { font-size: 24px; font-weight: 600; line-height: 1.4; word-wrap: break-word; }
    .cover-note { margin-top: 8px; font-size: 14px; color: #6b7280; }
  </style>
</head>
<body>
  <div>
    <div class="cover-name">E2E 最小富文本卡片</div>
    <div class="cover-note">E2E 夹具</div>
  </div>
</body>
</html>
