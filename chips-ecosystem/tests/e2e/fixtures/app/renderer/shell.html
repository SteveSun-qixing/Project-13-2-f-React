<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>E2E Harness</title>
    <style>
      html,
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #111827;
      }

      #shell-header {
        padding: 12px 16px;
      }

      #shell-name {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      #surface {
        padding: 0 16px 16px;
      }

      #card-frame {
        display: block;
        width: 100%;
        height: 0;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <header id="shell-header">
      <h1 id="shell-name"></h1>
    </header>
    <div id="surface">
      <iframe id="card-frame" sandbox="allow-scripts"></iframe>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const documentId = params.get('documentId');
      const nodeId = params.get('nodeId');
      const cardType = params.get('cardType');
      const cardName = params.get('name');
      const initialText = params.get('text');

      const PROTOCOL = 'chips-frame/1';
      const sessionId = 'harness-session';
      const frameId = 'harness-frame';
      const limits = { minHeight: 0, maxHeight: 2000, maxNestedFrames: 0 };

      document.title = cardName;
      document.getElementById('shell-name').textContent = cardName;

      function buildView(revision, contentText) {
        return {
          kind: 'card',
          revision,
          card_id: documentId,
          name: cardName,
          chip_standards_version: '1.0.0',
          cover_ratio: '3:4',
          tags: [],
          cover: { entry: '.card/cover.html', ratio: '3:4' },
          content_nodes: [
            {
              node_id: nodeId,
              card_type: cardType,
              content: {
                card_type: cardType,
                content_format: 'markdown',
                content_source: 'inline',
                content_text: contentText,
              },
            },
          ],
        };
      }

      const frame = document.getElementById('card-frame');
      let currentPort = null;
      let frameReady = false;
      let revision = 0;
      const token = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;

      function handleFrameMessage(event) {
        const envelope = event.data;
        if (!envelope || envelope.protocol !== PROTOCOL) {
          return;
        }
        const message = envelope.message;
        if (message.type === 'frame:ready') {
          frameReady = true;
          return;
        }
        if (message.type === 'frame:height' && currentPort !== null) {
          const height = Math.max(
            limits.minHeight,
            Math.min(limits.maxHeight, message.payload.height)
          );
          frame.style.height = `${height}px`;
          currentPort.postMessage({
            protocol: PROTOCOL,
            sessionId,
            frameId,
            message: { type: 'host:height-ack', payload: { epoch: message.payload.epoch } },
          });
        }
      }

      // 初始 about:blank 与新文档各自可能触发 load；每次用新 MessageChannel 重试，
      // 直到某一轮握手被帧接收（frame:ready 到达）。
      function sendInit() {
        if (frameReady) {
          return;
        }
        const channel = new MessageChannel();
        channel.port1.onmessage = handleFrameMessage;
        currentPort = channel.port1;
        // 首条消息只做握手：校验一次性令牌并转移端口；init 随端口排队投递，
        // 子帧挂上 onmessage 后按序收到（符合《渲染引擎设计》§9.1/§9.2）。
        frame.contentWindow.postMessage({ protocol: PROTOCOL, sessionId, frameId, token }, '*', [
          channel.port2,
        ]);
        channel.port1.postMessage({
          protocol: PROTOCOL,
          sessionId,
          frameId,
          message: {
            type: 'host:init',
            payload: {
              role: 'card',
              view: buildView(revision, initialText),
              nodes: [{ node_id: nodeId, card_type: cardType, containerId: 'node-0' }],
              resourceBase: '',
              pluginEntries: {},
              tokens: {},
              limits,
            },
          },
        });
      }

      frame.addEventListener('load', sendInit);
      frame.src = `frame.html#${token}`;

      window.chips.subscribe('document:changed', async () => {
        if (!frameReady || currentPort === null) {
          return;
        }
        const content = await window.chips.request('document:read', {
          documentId,
          part: 'content',
          nodeId,
        });
        revision += 1;
        currentPort.postMessage({
          protocol: PROTOCOL,
          sessionId,
          frameId,
          message: {
            type: 'host:update',
            payload: { view: buildView(revision, content.value.content_text), revision },
          },
        });
      });
    </script>
  </body>
</html>
