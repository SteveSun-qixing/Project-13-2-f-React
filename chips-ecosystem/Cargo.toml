[workspace]
resolver = "2"
members = ["packages/core-rust/crates/*", "packages/native"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
criterion = "0.5"
neon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
