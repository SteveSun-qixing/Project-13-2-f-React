id: com.chips.office
name: 薯片办公
version: 0.1.0
type: app
entry: dist/index.html

description: 薯片办公是薯片生态的办公四件套应用插件，提供 Word 文档（.docx）、电子表格（.xlsx/.xls/.csv）、演示文稿（.pptx）与 PDF 文档的查看与编辑能力，基于 GenOffice 引擎完整移植。

author:
  name: sevenstars
  email: office@chips.local

keywords:
  - chips
  - app
  - office
  - word
  - sheet
  - slide
  - pdf

permissions:
  - resource.read
  - file.read
  - file.write
  - platform.read
  - office.read
  - office.write
  - command.read
  - command.write
  - command.invoke

runtime:
  targets:
    desktop:
      supported: true
    web:
      supported: false
    mobile:
      supported: false
    headless:
      supported: false

capabilities:
  # Word 文档（.docx）— 专用 primary 层级查看与编辑
  - resource-handler:view:application/vnd.openxmlformats-officedocument.wordprocessingml.document
  - resource-handler:edit:application/vnd.openxmlformats-officedocument.wordprocessingml.document
  - file-handler:.docx
  # 电子表格（.xlsx/.xlsm/.xls/.csv）— 专用 primary 层级查看与编辑
  - resource-handler:view:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  - resource-handler:edit:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  - file-handler:.xlsx
  - file-handler:.xlsm
  - resource-handler:view:application/vnd.ms-excel
  - file-handler:.xls
  - resource-handler:view:text/csv
  - resource-handler:edit:text/csv
  - file-handler:.csv
  # 演示文稿（.pptx）— 专用 primary 层级查看与编辑
  - resource-handler:view:application/vnd.openxmlformats-officedocument.presentationml.presentation
  - resource-handler:edit:application/vnd.openxmlformats-officedocument.presentationml.presentation
  - file-handler:.pptx
  # PDF — 专用 primary 层级查看与编辑
  - resource-handler:view:application/pdf
  - resource-handler:edit:application/pdf
  - file-handler:.pdf

capabilityFallbacks:
  open-file:
    whenUnsupported: reject
  save-file:
    whenUnsupported: reject

cli:
  commands:
    - commandPath: office open
      target:
        type: app
        pluginId: com.chips.office
        surface:
          open: true
          focus: true
          reuse: preferred
      titleKey: office.cli.open.title
      descriptionKey: office.cli.open.description
      arguments:
        - name: path
          position: 0
          type: path
          required: false
          mapsTo: targetPath
      output:
        mode: json

engines:
  chips: "^1.0.0"

os:
  - darwin
  - win32
  - linux

ui:
  layout:
    owner: page
    unit: cpx
    baseWidth: 1024
  launcher:
    displayName: 薯片办公
    icon: assets/icons/app-icon.ico
  surface:
    defaultKind: window
    preferredKinds:
      desktop: window
      web: route
      mobile: fullscreen
      headless: window
  window:
    chrome:
      frame: true
