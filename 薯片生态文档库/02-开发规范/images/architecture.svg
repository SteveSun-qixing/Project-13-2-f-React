<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-label="薯片生态分层架构图">
  <title>薯片生态分层架构图</title>
  <desc>自上而下为插件生态层、薯片平台层、壳与系统层，层间分别经 Bridge 与 Neon 通信。</desc>
  <rect width="760" height="440" fill="#ffffff"/>
  <style>
    .layer { fill: #f5f5f5; stroke: #8c8c8c; stroke-width: 1.5; }
    .title { font: 600 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #262626; }
    .item  { font: 13px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #434343; }
    .link  { font: 12px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #595959; }
    .arrow { stroke: #8c8c8c; stroke-width: 1.5; fill: none; }
  </style>

  <rect class="layer" x="40" y="30" width="680" height="90" rx="8"/>
  <text class="title" x="60" y="58">插件生态层</text>
  <text class="item"  x="60" y="86">应用插件 · 基础卡片插件 · 箱子布局插件 · 服务插件</text>

  <line class="arrow" x1="380" y1="120" x2="380" y2="160"/>
  <polygon points="374,154 386,154 380,164" fill="#8c8c8c"/>
  <text class="link" x="394" y="146">Bridge（能力导向）</text>

  <rect class="layer" x="40" y="168" width="680" height="90" rx="8"/>
  <text class="title" x="60" y="196">薯片平台层</text>
  <text class="item"  x="60" y="224">Cordis 运行时 · Bridge · 文档解析 · 资源管理 · 渲染框架 · 权限/事件/配置系统</text>

  <line class="arrow" x1="380" y1="258" x2="380" y2="298"/>
  <polygon points="374,292 386,292 380,302" fill="#8c8c8c"/>
  <text class="link" x="394" y="284">Neon（Rust ↔ Node.js Native Module）</text>

  <rect class="layer" x="40" y="306" width="680" height="90" rx="8"/>
  <text class="title" x="60" y="334">壳与系统层</text>
  <text class="item"  x="60" y="362">Electron 壳（主进程 / 渲染进程 / preload） · 操作系统</text>
</svg>
