id: com.chips.card-viewer
name: 卡片查看器
version: 0.1.0
type: app
entry: dist/index.html

description: 卡片查看器应用，用于通过统一卡片显示链路查看复合卡片内容。Web target 只负责查看社区卡片页面与查看缓存，不提供上传和下载 .card；Desktop/Mobile 客户端 target 可接入统一卡片传输模块，支持打开社区卡片和下载完整卡片。

author:
  name: CardViewer
  email: dev@chips.local

keywords:
  - chips
  - card
  - viewer

capabilities:
  - file-handler:.card
  - file-handler:.box

permissions:
  - card.read
  - box.read
  - plugin.read
  - resource.read
  - platform.read
  - platform.external
  - module.invoke
  - network.request
  - command.read
  - command.write
  - command.invoke

runtime:
  targets:
    desktop:
      supported: true
    web:
      supported: true
    mobile:
      supported: true
    headless:
      supported: false

capabilityFallbacks:
  open-file:
    whenUnsupported: reject
  save-file:
    whenUnsupported: reject

engines:
  chips: "^1.0.0"

os:
  - darwin
  - win32
  - linux

ui:
  layout:
    owner: page
    unit: cpx
    baseWidth: 1024
  launcher:
    displayName: 卡片查看器
    icon: assets/icons/app-icon.ico
  surface:
    defaultKind: window
    preferredKinds:
      desktop: window
      web: route
      mobile: fullscreen
      headless: window
  window:
    chrome:
      titleBarStyle: default
