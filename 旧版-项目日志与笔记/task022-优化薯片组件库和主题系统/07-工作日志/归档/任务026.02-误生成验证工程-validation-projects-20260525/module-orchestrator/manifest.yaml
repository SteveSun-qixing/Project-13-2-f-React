id: chips.module.module.orchestrator
name: Module Orchestrator
version: 0.1.0
type: module
entry: dist/index.mjs
description: 模块编排无界面插件。
author:
  name: sevenstars
  email: module-orchestrator@example.invalid
permissions:
  - module.read
  - module.invoke
runtime:
  targets:
    desktop:
      supported: true
    web:
      supported: false
    mobile:
      supported: false
    headless:
      supported: true
engines:
  chips: "^0.1.0"
os:
  - darwin
  - win32
  - linux
module:
  apiVersion: 1
  runtime: worker
  activation: onDemand
  provides:
    - capability: module.module.orchestrator
      version: "1.0.0"
      description: 编排下游模块能力并返回统一结果。
      methods:
        - name: execute
          mode: job
          inputSchema: contracts/execute.input.schema.json
          outputSchema: contracts/execute.output.schema.json
  consumes:
    - capability: "module.example.step"
      versionRange: "^1.0.0"
