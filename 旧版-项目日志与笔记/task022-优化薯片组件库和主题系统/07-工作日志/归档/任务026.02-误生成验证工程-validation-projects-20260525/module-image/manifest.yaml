id: chips.module.module.image
name: Module Image
version: 0.1.0
type: module
entry: dist/index.mjs
description: 图像处理无界面模块插件。
author:
  name: sevenstars
  email: module-image@example.invalid
permissions:
  - file.read
runtime:
  targets:
    desktop:
      supported: true
    web:
      supported: false
    mobile:
      supported: false
    headless:
      supported: true
engines:
  chips: "^0.1.0"
os:
  - darwin
  - win32
  - linux
module:
  apiVersion: 1
  runtime: worker
  activation: onDemand
  provides:
    - capability: module.module.image
      version: "1.0.0"
      description: 读取图像并输出稳定分析摘要。
      methods:
        - name: process
          mode: sync
          inputSchema: contracts/process.input.schema.json
          outputSchema: contracts/process.output.schema.json
  consumes: []
