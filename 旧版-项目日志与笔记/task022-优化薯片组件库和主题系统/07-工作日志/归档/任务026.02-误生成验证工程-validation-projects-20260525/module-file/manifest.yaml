id: chips.module.module.file
name: Module File
version: 0.1.0
type: module
entry: dist/index.mjs
description: 文件转换无界面模块插件。
author:
  name: sevenstars
  email: module-file@example.invalid
permissions:
  - file.read
  - file.write
runtime:
  targets:
    desktop:
      supported: true
    web:
      supported: false
    mobile:
      supported: false
    headless:
      supported: true
engines:
  chips: "^0.1.0"
os:
  - darwin
  - win32
  - linux
module:
  apiVersion: 1
  runtime: worker
  activation: onDemand
  provides:
    - capability: module.module.file
      version: "1.0.0"
      description: 将输入文件转换为输出工件。
      methods:
        - name: convert
          mode: job
          inputSchema: contracts/convert.input.schema.json
          outputSchema: contracts/convert.output.schema.json
  consumes: []
