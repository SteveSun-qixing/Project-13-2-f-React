id: com.chips.office
name: Chips Office
version: 0.1.0
type: app
entry: dist/index.html

description: 薯片生态 Office 文档处理应用，支持查看和编辑 Word 文档（.docx/.doc）、PowerPoint 演示文稿（.pptx/.ppt）。

author:
  name: Chips Ecosystem
  email: dev@chips.local

keywords:
  - chips
  - office
  - word
  - docx
  - powerpoint
  - pptx
  - document
  - editor

capabilities:
  # PDF 文件处理
  - file-handler:view:application/pdf
  - file-handler:edit:application/pdf
  - file-handler:preview:application/pdf
  # Word 文档处理
  - file-handler:view:application/vnd.openxmlformats-officedocument.wordprocessingml.document
  - file-handler:edit:application/vnd.openxmlformats-officedocument.wordprocessingml.document
  - file-handler:preview:application/vnd.openxmlformats-officedocument.wordprocessingml.document
  # PowerPoint 演示文稿处理
  - file-handler:view:application/vnd.openxmlformats-officedocument.presentationml.presentation
  - file-handler:edit:application/vnd.openxmlformats-officedocument.presentationml.presentation
  - file-handler:preview:application/vnd.openxmlformats-officedocument.presentationml.presentation
  # Excel 表格处理
  - file-handler:view:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  - file-handler:edit:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  - file-handler:preview:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  # 传统 Office 格式（兼容）
  - file-handler:view:application/msword
  - file-handler:edit:application/msword
  - file-handler:view:application/vnd.ms-powerpoint
  - file-handler:edit:application/vnd.ms-powerpoint
  - file-handler:view:application/vnd.ms-excel
  - file-handler:edit:application/vnd.ms-excel

permissions:
  - resource.read
  - file.read
  - file.write
  - platform.read
  - zip.manage
  - command.read
  - command.write
  - command.invoke

runtime:
  targets:
    desktop:
      supported: true
    web:
      supported: false
    mobile:
      supported: false
    headless:
      supported: false

capabilityFallbacks:
  open-file:
    whenUnsupported: reject
  save-file:
    whenUnsupported: download

commands:
  - id: chips-office open
    type: builtin
    description: 使用 Chips Office 打开 Office 文档

engines:
  chips: "^1.0.0"

os:
  - darwin
  - win32
  - linux

ui:
  layout:
    owner: page
    unit: cpx
    baseWidth: 1024
  launcher:
    displayName: Chips Office
    icon: assets/icons/app-icon.ico
  surface:
    defaultKind: window
    preferredKinds:
      desktop: window
      web: route
      mobile: fullscreen
      headless: window
  window:
    chrome:
      titleBarStyle: default
