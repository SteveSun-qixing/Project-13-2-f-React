id: com.chips.sheet
name: 表格编辑器
version: 0.1.0
type: app
entry: dist/index.html

description: 薯片生态表格编辑器应用插件，用于打开、编辑与保存 Excel（.xlsx/.xlsm）与 CSV 表格文件。

author:
  name: Chips Sheet
  email: dev@chips.local

keywords:
  - chips
  - sheet
  - xlsx
  - editor

capabilities:
  - resource-handler:view:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  - resource-handler:view:application/vnd.ms-excel.sheet.macroenabled.12
  - resource-handler:view:text/csv
  - file-handler:.xlsx
  - file-handler:.xlsm
  - file-handler:.csv

permissions:
  - resource.read
  - file.read
  - file.write
  - office.read
  - office.write
  - platform.read
  - config.read
  - config.write
  - network.request
  - command.read
  - command.write
  - command.invoke

runtime:
  targets:
    desktop:
      supported: true
    web:
      supported: true
    mobile:
      supported: false
    headless:
      supported: false

capabilityFallbacks:
  open-file:
    whenUnsupported: reject
  save-file:
    whenUnsupported: download

cli:
  commands:
    - commandPath: chips-sheet open
      target:
        type: app
        pluginId: com.chips.sheet
        surface:
          open: true
          focus: true
          reuse: preferred
      titleKey: 打开表格编辑器
      descriptionKey: 启动表格编辑器并聚焦工作区
      arguments:
        - name: subject
          position: 0
          type: string
          required: false
          mapsTo: subject
      output:
        mode: json

engines:
  chips: "^1.0.0"

os:
  - darwin
  - win32
  - linux

ui:
  layout:
    owner: page
    unit: cpx
    baseWidth: 1024
  launcher:
    displayName: 表格编辑器
    icon: assets/icons/app-icon.ico
  surface:
    defaultKind: window
    preferredKinds:
      desktop: window
      web: route
      mobile: fullscreen
      headless: window
  window:
    chrome:
      titleBarStyle: default
