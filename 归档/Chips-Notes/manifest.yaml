id: chips.notes
name: 薯片笔记
version: 0.1.0
type: app
entry: dist/index.html

description: 基于薯片生态的笔记应用，使用箱子和卡片存储笔记，支持 Markdown 编辑。

author:
  name: Chips Ecosystem
  email: support@chips-ecosystem.com

keywords:
  - chips
  - notes
  - app
  - markdown

permissions:
  - card.read
  - card.write
  - file.read
  - file.write
  - box.read
  - box.write
  - command.read
  - command.write
  - command.invoke
  - config.read
  - config.write
  - platform.read

runtime:
  targets:
    desktop:
      supported: true
    web:
      supported: false
    mobile:
      supported: false
    headless:
      supported: false

engines:
  chips: "^1.0.0"

os:
  - darwin
  - win32
  - linux

ui:
  layout:
    owner: page
    unit: cpx
    baseWidth: 1024
  launcher:
    displayName: 薯片笔记
    icon: assets/icons/app-icon.ico
  surface:
    defaultKind: window
    preferredKinds:
      desktop: window
      web: route
      mobile: fullscreen
      headless: window
  window:
    chrome:
      frame: true
      transparent: false
      backgroundColor: "#ffffff"
      titleBarStyle: default
